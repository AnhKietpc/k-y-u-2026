<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kỷ Yếu 2026 - Anh Kiệt</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,600;1,400&family=Great+Vibes&display=swap');

        :root {
            --bg-blue-lace: #a4b9c8;
            --env-color: #fffef9;
            --ribbon-blue: #5d7a92;
            --paper: #fdfdfd;
            --seal-pink: #eeb7b7;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-blue-lace);
            background-image: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.3) 15%, transparent 16%), linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 40px 40px, 100% 40px;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
        }

        /* Nơ trang trí góc */
        .bow { position: absolute; font-size: 3.5rem; z-index: 1; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1)); }
        .tl { top: 20px; left: 20px; transform: rotate(-15deg); }
        .tr { top: 20px; right: 20px; transform: rotate(15deg); }

        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            perspective: 1200px;
            z-index: 10;
        }

        .envelope {
            position: relative;
            width: 450px;
            height: 320px;
            background-color: var(--env-color);
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }

        /* CHỮ NỔI TRÊN MẶT PHONG THƯ */
        .envelope-title {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
            z-index: 6; /* Nằm trên cả nắp thư */
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            pointer-events: none;
            color: #efede4; /* Màu gần giống màu phong thư */
            text-shadow: 
                -1px -1px 1px rgba(255,255,255,0.8),
                1px 1px 1px rgba(0,0,0,0.1);
            transition: opacity 0.5s ease;
        }

        /* Khi mở thư thì chữ mờ dần để thấy nội dung bên trong */
        .envelope-wrapper.open .envelope-title {
            opacity: 0;
        }

        /* Nắp phong thư */
        .envelope::before {
            content: "";
            position: absolute;
            top: 0;
            z-index: 4;
            border-top: 170px solid #f4f1e4;
            border-left: 225px solid transparent;
            border-right: 225px solid transparent;
            transform-origin: top;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Thân phong thư */
        .envelope::after {
            content: "";
            position: absolute;
            bottom: 0;
            z-index: 3;
            width: 0;
            height: 0;
            border-top: 160px solid transparent;
            border-right: 225px solid var(--env-color);
            border-bottom: 160px solid var(--env-color);
            border-left: 225px solid var(--env-color);
        }

        .card {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 90%;
            background-color: var(--paper);
            z-index: 2;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 15px;
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid #eee;
            opacity: 0;
        }

        .card-content {
            border: 1px dashed var(--ribbon-blue);
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-content h2 { font-family: 'Dancing Script', cursive; color: var(--ribbon-blue); font-size: 1.8rem; margin: 0; }
        .card-content p { font-size: 0.8rem; color: #555; margin: 5px 0; }

        .photo-frame {
            background: white;
            padding: 5px 5px 15px 5px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
            transform: rotate(3deg);
        }
        .photo-frame img { width: 100%; height: 130px; object-fit: cover; }

        .wax-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 70px;
            height: 70px;
            background: var(--seal-pink);
            border-radius: 50%;
            z-index: 7;
            transform: translate(-50%, -10%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.5s;
        }
        .wax-seal::after { content: "🎀"; font-size: 1.8rem; }

        .envelope-wrapper.open .envelope::before { transform: rotateX(180deg); z-index: 1; }
        .envelope-wrapper.open .card { transform: translate(-50%, -250px) rotate(-2deg); opacity: 1; z-index: 5; }
        .envelope-wrapper.open .wax-seal { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div class="bow tl">🎀</div>
    <div class="bow tr">🎀</div>

    <div class="envelope-wrapper" onclick="this.classList.toggle('open')">
        <div class="envelope-title">Graduation Invitations</div>
        
        <div class="envelope">
            <div class="card">
                <div class="card-content">
                    <h2>Thân Mời</h2>
                    <p>Mời bạn đến dự buổi lễ tốt nghiệp của tụi mình.</p>
                    <p><b>Niên khóa 2023 - 2026</b></p>
                    <p>Tại: THPT Chuyên Biên Hòa</p>
                    <p style="font-size: 0.7rem; font-style: italic; margin-top: 10px;">"Keep the memories!"</p>
                </div>
                <div class="card-photos">
                    <div class="photo-frame">
                        <img src="https://images.unsplash.com/photo-1523050853064-dbad350090ad" alt="Graduation">
                    </div>
                </div>
            </div>
        </div>
        <div class="wax-seal"></div>
    </div>

</body>
</html>
