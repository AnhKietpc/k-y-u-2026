<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiệp Mời Tốt Nghiệp - Anh Kiệt</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --denim-blue: #2c5282;
            --bg-paper: #e3e9f0; /* Nền xanh khói để hiện rõ con ma trắng */
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #cbd5e0;
            font-family: 'Courier New', Courier, monospace;
        }

        #app {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            margin: 0 auto;
            background-image: url('https://www.transparenttextures.com/patterns/crumpled-paper.png');
            background-color: var(--bg-paper);
            box-shadow: 0 0 50px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        /* --- HIỆU ỨNG DIỄN XUẤT CỦA CON MA --- */
        .ghost-container {
            position: relative;
            width: 200px;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .ghost { 
            width: 160px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            /* Kết hợp 2 hiệu ứng: vẫy chào và gật đầu đọc thiệp */
            animation: 
                ghostWave 2s ease-in-out infinite, 
                ghostNod 4s ease-in-out infinite;
            transform-origin: bottom center; /* Giữ chân cố định để vẫy phần thân trên */
        }

        /* Hiệu ứng vẫy tay (lắc nhẹ qua lại) */
        @keyframes ghostWave {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        /* Hiệu ứng gật đầu (nhấp nhô như đang đọc thiệp) */
        @keyframes ghostNod {
            0%, 20%, 100% { margin-top: 0px; }
            50%, 70% { margin-top: 15px; } /* Hạ thấp xuống như đang nhìn vào tấm thiệp trên tay */
        }

        /* Tấm thiệp nhỏ con ma cầm trên tay (Sticker phụ) */
        .mini-card {
            position: absolute;
            bottom: 40px;
            width: 50px;
            z-index: 12;
            transform: rotate(-10deg);
            animation: cardFollow 2s ease-in-out infinite;
        }

        @keyframes cardFollow {
            0%, 100% { transform: rotate(-10deg) translateX(-5px); }
            50% { transform: rotate(5deg) translateX(5px); }
        }

        /* --- TRANG TRÍ XUNG QUANH --- */
        .sticker { position: absolute; z-index: 5; user-select: none; }
        .torn-paper { position: absolute; background: var(--denim-blue); z-index: 2; }
        .edge-top { top: 0; left: 0; width: 100%; height: 40px; clip-path: polygon(0 0, 100% 0, 100% 70%, 85% 90%, 70% 75%, 50% 95%, 30% 70%, 15% 90%, 0 75%); }
        .edge-bottom { bottom: 0; left: 0; width: 100%; height: 60px; clip-path: polygon(0 25%, 15% 10%, 30% 30%, 50% 5%, 70% 25%, 85% 10%, 100% 30%, 100% 100%, 0 100%); }

        /* --- GIAO DIỆN CHỜ --- */
        #intro {
            position: relative;
            z-index: 15;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
        }

        .btn-open {
            background: var(--denim-blue);
            color: white;
            border: 2px solid #fff;
            padding: 12px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 30px;
            font-weight: bold;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.2);
        }

        #invitation-card {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 300px;
            background: white;
            padding: 10px 10px 50px 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            display: none;
            z-index: 20;
        }
    </style>
</head>
<body>

<div id="app">
    <div class="torn-paper edge-top"></div>
    <div class="torn-paper edge-bottom"></div>

    <div class="sticker" style="top: 15%; left: 10%; font-size: 25px;">✨</div>
    <div class="sticker" style="top: 20%; right: 15%; font-size: 30px;">🎀</div>
    <div class="sticker" style="bottom: 120px; left: 30px; font-size: 40px;">🐳</div>

    <div id="intro">
        <div class="ghost-container">
            <img src="https://cdn-icons-png.flaticon.com/512/2541/2541991.png" class="mini-card">
            <img src="https://cdn-icons-png.flaticon.com/512/1042/1042340.png" class="ghost">
        </div>
        
        <div style="background: rgba(255,255,255,0.8); padding: 15px; margin-top: 20px; border: 2px dashed var(--denim-blue);">
            <h2 style="margin: 0;">CHÀO ANH KIỆT! 👋</h2>
            <p style="margin: 5px 0;">Đang đọc thư của Hà Anh nè...</p>
        </div>

        <button class="btn-open" onclick="openCard()">XEM CHI TIẾT ✉️</button>
    </div>

    <div id="invitation-card">
        <img src="https://via.placeholder.com/300x400/2c5282/ffffff?text=LỄ+TỐT+NGHIỆP+2026" style="width:100%">
        <p style="text-align:center; font-weight:bold; color: var(--denim-blue);">HẸN GẶP BẠN NHÉ!</p>
        <button onclick="location.reload()" style="width:100%; border:none; background:#f0f0f0; padding:10px; cursor:pointer;">Xem lại từ đầu ↺</button>
    </div>
</div>

            document.getElementById('intro').style.display = 'none';
        }});
